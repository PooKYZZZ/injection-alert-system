services:
  backend:
    environment:
      WAF_SOURCE_VERIFICATION_MODE: ${WAF_SOURCE_VERIFICATION_MODE:-unverified}
      CLOUDFLARE_TARGET_ISOLATION_ENABLED: "true"
      CLOUDFLARE_TARGET_VERIFIED_PROOF: ${CLOUDFLARE_TARGET_VERIFIED_PROOF:-false}

  demo-target-bridge:
    environment:
      WAF_SOURCE_PROVENANCE_MODE: ${WAF_SOURCE_PROVENANCE_MODE:-direct_remote_addr}

  cloudflared:
    image: cloudflare/cloudflared@sha256:188bb03589a32affed3cf4d0590565ffe67b78866e6b5582574afab2b705bafe
    profiles:
      - target-cloudflare
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:20241
      - run
      - --token-file
      - /run/secrets/cloudflared_target_token
    expose:
      - "20241"
    secrets:
      - source: cloudflared_target_token
        target: cloudflared_target_token
        mode: 0400
    networks:
      target_cloudflare_egress: {}
      target_waf_ingress:
        ipv4_address: 172.30.20.2
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - ready
        - --metrics
        - 127.0.0.1:20241
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  demo-target-modsecurity:
    ports: !override []
    environment:
      REAL_IP_HEADER: CF-Connecting-IP
      REAL_IP_PROXY_HEADER: CF-Connecting-IP
      REAL_IP_RECURSIVE: "off"
      SET_REAL_IP_FROM: 172.30.20.2/32
    volumes:
      - ./config/modsecurity/target-cloudflare-realip.conf.template:/etc/nginx/templates/conf.d/realip.conf.template:ro
    networks:
      default: {}
      target_waf_ingress:
        ipv4_address: 172.30.20.3

secrets:
  cloudflared_target_token:
    file: ${CLOUDFLARED_TARGET_TOKEN_FILE:?Set CLOUDFLARED_TARGET_TOKEN_FILE to a token file outside the repository}

networks:
  target_cloudflare_egress:
    internal: false
  target_waf_ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/28
