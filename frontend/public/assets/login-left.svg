<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07123a" />
      <stop offset="50%" stop-color="#08153f" />
      <stop offset="100%" stop-color="#26103f" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#g)" />
  <rect width="100%" height="100%" fill="url(#glow)" />

  <!-- network polygon strokes -->
  <g fill="none" stroke="#66d3ff" stroke-opacity="0.14" stroke-width="1.2">
    <polyline points="40,120 120,60 200,120 140,200" />
    <polyline points="30,300 110,240 190,300 130,380" />
    <polyline points="20,520 100,460 180,520 120,600" />
    <polyline points="40,740 120,680 200,740 140,820" />
  </g>

  <!-- dots -->
  <g fill="#7dd3fc" fill-opacity="0.14">
    <circle cx="48" cy="112" r="2.6" />
    <circle cx="128" cy="64" r="2.6" />
    <circle cx="208" cy="120" r="2.6" />
    <circle cx="36" cy="308" r="2.6" />
    <circle cx="116" cy="252" r="2.6" />
    <circle cx="196" cy="308" r="2.6" />
    <circle cx="28" cy="528" r="2.6" />
    <circle cx="108" cy="470" r="2.6" />
    <circle cx="188" cy="528" r="2.6" />
    <circle cx="44" cy="748" r="2.6" />
    <circle cx="124" cy="692" r="2.6" />
    <circle cx="204" cy="748" r="2.6" />
  </g>

  <!-- decorative triangles, left aligned -->
  <g fill="#8b5cf6" fill-opacity="0.08" stroke="#b794f4" stroke-opacity="0.06">
    <polygon points="16,96 72,48 120,112" />
    <polygon points="8,280 96,220 140,304" />
    <polygon points="12,500 96,440 156,520" />
    <polygon points="24,720 108,660 168,736" />
  </g>

  <!-- subtle vignette on right edge to help content legibility -->
  <rect x="240" y="0" width="360" height="900" fill="black" opacity="0.06" />
</svg>
