services:
  backend:
    # Hosted migrations are an explicit operator step. The base command is
    # intentionally guarded for local development and must not reject the
    # hosted Supabase URL before the application starts.
    command:
      [
        "sh",
        "-c",
        "uvicorn --factory web_app.presentation.app:create_app --host 0.0.0.0 --port 8000",
      ]
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV must be explicitly set for hosted deployment}

  demo-portal:
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV must be explicitly set for hosted deployment}

  demo-target-modsecurity:
    ports: !override
      - "127.0.0.1:8089:8080"
    environment:
      REAL_IP_HEADER: CF-Connecting-IP
      REAL_IP_PROXY_HEADER: CF-Connecting-IP
      REAL_IP_RECURSIVE: "off"
      SET_REAL_IP_FROM: ${HOSTED_WAF_TRUSTED_PEER:?Set HOSTED_WAF_TRUSTED_PEER to the observed narrow tunnel peer or subnet}
    volumes:
      - ./config/modsecurity/source-correlation-realip.conf.template:/etc/nginx/templates/conf.d/realip.conf.template:ro
