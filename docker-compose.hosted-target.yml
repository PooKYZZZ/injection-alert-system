services:
  demo-target-modsecurity:
    ports: !override
      - "127.0.0.1:8089:8080"
    environment:
      REAL_IP_HEADER: CF-Connecting-IP
      REAL_IP_PROXY_HEADER: CF-Connecting-IP
      REAL_IP_RECURSIVE: "on"
      SET_REAL_IP_FROM: ${HOSTED_WAF_TRUSTED_PEER:?Set HOSTED_WAF_TRUSTED_PEER to the observed narrow tunnel peer or subnet}
