# Isolated M8 route-matrix environment. Start with:
# docker compose --env-file .env -p cybertrace-m08-e2e -f docker-compose.m08-multi-route-test.yml up -d --build
# The backend uses a fresh container-local SQLite database. The portal database
# and ModSecurity audit log must be supplied from a dedicated temporary folder.
services:
  portal-db-init:
    build:
      context: ${DEMO_PORTAL_CONTEXT:?Set DEMO_PORTAL_CONTEXT to the target portal checkout}
      dockerfile: Dockerfile
      target: builder
    command: ["sh", "-c", "npm run db:push && npm run db:seed"]
    environment:
      DATABASE_URL: file:./dev.db
    volumes:
      - ${CYBERTRACE_M08_PORTAL_DB_FILE:?Set CYBERTRACE_M08_PORTAL_DB_FILE to a new temporary file}:/app/prisma/dev.db
    restart: "no"

  backend:
    build:
      context: .
      args:
        INSTALL_TRAINING_REQUIREMENTS: "false"
    command:
      [
        "uvicorn",
        "--factory",
        "web_app.presentation.app:create_app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:////tmp/cybertrace-m08-e2e.db
      ENFORCEMENT_MODE: shadow
      ENFORCEMENT_SOURCE_TRUST_MODE: unverified
      WAF_SOURCE_VERIFICATION_MODE: unverified
      WAF_STATE_SYNC_ENABLED: "false"
      PR7_CRITICAL_WAF_MUTATION_ENABLED: "false"
      NOTIFICATION_WORKER_ENABLED: "false"
      THREAT_EMAIL_ENABLED: "false"
      THREAT_TELEGRAM_ENABLED: "false"
    expose:
      - "8000"
    volumes:
      - ${CYBERTRACE_M08_AUDIT_DIR:?Set CYBERTRACE_M08_AUDIT_DIR to a temporary directory}:/app/m08-e2e-audit:ro
      - ${CYBERTRACE_M08_RESULTS_DIR:?Set CYBERTRACE_M08_RESULTS_DIR to a temporary directory}:/app/m08-e2e-results
      - ./scripts/multi_route_waf_e2e_tester.py:/app/scripts/multi_route_waf_e2e_tester.py:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  demo-portal:
    build:
      context: ${DEMO_PORTAL_CONTEXT:?Set DEMO_PORTAL_CONTEXT to the target portal checkout}
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3010
      DATABASE_URL: file:./dev.db
      ENFORCEMENT_MODE: shadow
      ENFORCEMENT_CHECK_URL: http://backend:8000/api/internal/enforcement/check
      ENFORCEMENT_CHALLENGE_URL: http://backend:8000/api/internal/enforcement/challenge
      ENFORCEMENT_CHECK_API_KEY: ${ENFORCEMENT_CHECK_API_KEY:?Set ENFORCEMENT_CHECK_API_KEY in .env}
      ENFORCEMENT_CHECK_TIMEOUT_MS: "3000"
      ENFORCEMENT_CHALLENGE_TIMEOUT_MS: "5000"
      ENFORCEMENT_SOURCE_TRUST_MODE: unverified
      ENFORCEMENT_ALLOW_UNVERIFIED_SOURCE_FOR_TESTS: "true"
      WAF_INGEST_URL: http://backend:8000/api/internal/waf-events
      WAF_INGEST_API_KEY: ${WAF_INGEST_API_KEY:?Set WAF_INGEST_API_KEY in .env}
      WAF_AUDIT_EVIDENCE_KEY: ${WAF_AUDIT_EVIDENCE_KEY:?Set WAF_AUDIT_EVIDENCE_KEY in .env}
      WAF_INGEST_TIMEOUT_MS: "10000"
    volumes:
      - ${CYBERTRACE_M08_PORTAL_DB_FILE:?Set CYBERTRACE_M08_PORTAL_DB_FILE to a new temporary file}:/app/prisma/dev.db
    expose:
      - "3010"
    depends_on:
      portal-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3010/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  demo-target-modsecurity:
    image: owasp/modsecurity-crs@sha256:0385a81159d5112c113eeeed01c3f6cf05113891b02addc23abeab180934911e
    ports:
      - "127.0.0.1:18089:8080"
    environment:
      BACKEND: http://demo-portal:3010
      PORT: 8080
      PARANOIA: 1
      BLOCKING_PARANOIA: 1
      ALLOWED_METHODS: GET POST PATCH
      MODSEC_RULE_ENGINE: On
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsecurity/modsec_audit.jsonl
      MODSEC_AUDIT_LOG_PARTS: AIJDEFHZ
      MODSEC_AUDIT_LOG_RELEVANT_STATUS: "^(?:5|4(?!04))"
      CYBERTRACE_NORMAL_ACCESS_TELEMETRY: "true"
    volumes:
      - ${CYBERTRACE_M08_AUDIT_DIR:?Set CYBERTRACE_M08_AUDIT_DIR to a temporary directory}:/var/log/modsecurity
      - ./config/modsecurity/source-correlation-proxy-backend.conf.template:/etc/nginx/templates/includes/proxy_backend.conf.template:ro
      - ./config/modsecurity/normal-access-logging.conf.template:/etc/nginx/templates/conf.d/00-normal-access-logging.conf.template:ro
      - m08_normal_access_socket:/run/cybertrace-normal
    depends_on:
      demo-portal:
        condition: service_healthy
      demo-target-bridge:
        condition: service_healthy
    healthcheck:
      disable: true

  demo-target-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    environment:
      WAF_INGEST_API_KEY: ${WAF_INGEST_API_KEY:?Set WAF_INGEST_API_KEY in .env}
      WAF_AUDIT_EVIDENCE_KEY: ${WAF_AUDIT_EVIDENCE_KEY:?Set WAF_AUDIT_EVIDENCE_KEY in .env}
      WAF_SOURCE_PROVENANCE_MODE: direct_remote_addr
      WAF_TRUSTED_TUNNEL_PEER: ""
      CYBERTRACE_NORMAL_ACCESS_TELEMETRY: "true"
      WAF_INGEST_TIMEOUT_SECONDS: "30"
      WAF_INGEST_MAX_RETRIES: "20"
      WAF_INGEST_RETRY_DELAY_SECONDS: "2"
    command:
      [
        "sh",
        "-c",
        "exec python -u -m scripts.waf_audit_bridge --input /var/log/modsecurity/modsec_audit.jsonl --normal-access-socket /run/cybertrace-normal/normal.sock --follow --endpoint http://backend:8000/api/internal/waf-events --timeout \"$$WAF_INGEST_TIMEOUT_SECONDS\" --max-retries \"$$WAF_INGEST_MAX_RETRIES\" --retry-delay \"$$WAF_INGEST_RETRY_DELAY_SECONDS\"",
      ]
    volumes:
      - ${CYBERTRACE_M08_AUDIT_DIR:?Set CYBERTRACE_M08_AUDIT_DIR to a temporary directory}:/var/log/modsecurity:ro
      - m08_normal_access_socket:/run/cybertrace-normal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,stat,sys; p='/run/cybertrace-normal/normal.sock'; sys.exit(0 if stat.S_ISSOCK(os.stat(p).st_mode) else 1)",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

volumes:
  m08_normal_access_socket:
