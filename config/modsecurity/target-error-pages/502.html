<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>Service Unavailable</title>
    <link rel="stylesheet" href="/cybertrace-error-page.css">
  </head>
  <body>
    <main class="error-screen">
      <article class="error-card" aria-labelledby="error-title">
        <header class="error-header">
          <a class="error-brand" href="/" aria-label="Land Records Portal home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.3 8.2-8 10-4.7-1.8-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
            <span>Land Records Portal</span>
          </a>
          <span class="error-status" aria-label="HTTP 502">502</span>
        </header>
        <section class="error-content">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="4" width="8" height="6" rx="1"/><rect x="13.5" y="14" width="8" height="6" rx="1"/><path d="M10.5 7h4a3 3 0 0 1 3 3v4M13.5 17h-4a3 3 0 0 1-3-3v-1"/><path d="m15 12 2.5 2.5L20 12"/></svg>
          <h1 id="error-title">Service Unavailable</h1>
          <p class="error-message">We couldn't reach the service right now. Please try again in a moment.</p>
          <form action="" method="get"><button class="error-action" type="submit">Try Again</button></form>
        </section>
      </article>
    </main>
  </body>
</html>
