<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>Access Restricted</title>
    <link rel="stylesheet" href="/cybertrace-error-page.css">
  </head>
  <body>
    <main class="error-screen">
      <article class="error-card" aria-labelledby="error-title">
        <header class="error-header">
          <a class="error-brand" href="/" aria-label="Land Records Portal home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.3 8.2-8 10-4.7-1.8-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
            <span>Land Records Portal</span>
          </a>
          <span class="error-status" aria-label="HTTP 403">403</span>
        </header>
        <section class="error-content">
          <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.3 8.2-8 10-4.7-1.8-8-5-8-10V6l8-3Z"/><path d="M12 8v5m0 3h.01"/></svg>
          <h1 id="error-title">Access Restricted</h1>
          <p class="error-message">We couldn't complete your request because access was restricted.</p>
          <a class="error-action" href="/">Return to Homepage</a>
          <p class="error-support">Need help? <a href="/support">Contact Support</a>.</p>
        </section>
      </article>
    </main>
  </body>
</html>
