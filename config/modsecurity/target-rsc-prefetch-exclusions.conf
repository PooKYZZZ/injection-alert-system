# Next.js App Router Link prefetches carry the current page URL in Referer.
# When Search Records has an attack-like query, CRS 942100 sees that same
# already-inspected value again on the prefetch request. Exclude only Referer
# from this one CRS rule for recognized RSC prefetches originating at Search.
# The original Search Records request and all other request targets remain
# inspected.
SecRule REQUEST_METHOD "@streq GET" "id:1001001,phase:1,pass,nolog,t:none,chain"
    SecRule ARGS_NAMES "@streq _rsc" "t:none,chain"
    SecRule REQUEST_HEADERS:RSC "@streq 1" "t:none,chain"
    SecRule REQUEST_HEADERS:Next-Router-Prefetch "@streq 1" "t:none,chain"
    SecRule REQUEST_HEADERS:Referer "@rx ^https?://[^/]+/records/search\?query=" "t:none,ctl:ruleRemoveTargetById=942100;REQUEST_HEADERS:Referer"
