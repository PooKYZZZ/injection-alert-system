services:
  demo-portal:
    build:
      context: ${DEMO_PORTAL_CONTEXT:-../injection-alert-system-portal-pre-waf}
      dockerfile: Dockerfile
    profiles:
      - demo-target
    expose:
      - "3010"
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
      HOSTNAME: 0.0.0.0
      PORT: 3010
      # Prisma resolves SQLite URLs relative to prisma/schema.prisma.
      DATABASE_URL: file:./dev.db
      ENFORCEMENT_MODE: ${ENFORCEMENT_MODE:-off}
      ENFORCEMENT_CHECK_URL: http://backend:8000/api/internal/enforcement/check
      ENFORCEMENT_CHALLENGE_URL: http://backend:8000/api/internal/enforcement/challenge
      ENFORCEMENT_CHECK_API_KEY: ${ENFORCEMENT_CHECK_API_KEY:-}
      ENFORCEMENT_CHECK_TIMEOUT_MS: ${ENFORCEMENT_CHECK_TIMEOUT_MS:-1000}
      ENFORCEMENT_CHALLENGE_TIMEOUT_MS: ${ENFORCEMENT_CHALLENGE_TIMEOUT_MS:-5000}
      ENFORCEMENT_TURNSTILE_SITE_KEY: ${ENFORCEMENT_TURNSTILE_SITE_KEY:-}
      ENFORCEMENT_SOURCE_TRUST_MODE: ${ENFORCEMENT_SOURCE_TRUST_MODE:-unverified}
      ENFORCEMENT_ALLOW_UNVERIFIED_SOURCE_FOR_TESTS: ${ENFORCEMENT_ALLOW_UNVERIFIED_SOURCE_FOR_TESTS:-false}
    volumes:
      - ${DEMO_PORTAL_CONTEXT:-../injection-alert-system-portal-pre-waf}/prisma:/app/prisma
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3010/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  demo-target-modsecurity:
    image: owasp/modsecurity-crs@sha256:0385a81159d5112c113eeeed01c3f6cf05113891b02addc23abeab180934911e
    profiles:
      - demo-target
    ports:
      - "8089:8080"
    # Prevent the image's 30-second self-check from becoming WAF telemetry.
    healthcheck:
      disable: true
    environment:
      BACKEND: http://demo-portal:3010
      PORT: 8080
      PARANOIA: 1
      BLOCKING_PARANOIA: 1
      ALLOWED_METHODS: GET POST PATCH
      MODSEC_RULE_ENGINE: On
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsecurity/modsec_audit.jsonl
      MODSEC_AUDIT_LOG_PARTS: AIJDEFHZ
      MODSEC_AUDIT_LOG_RELEVANT_STATUS: "^(?:5|4(?!04))"
      CYBERTRACE_NORMAL_ACCESS_TELEMETRY: ${CYBERTRACE_NORMAL_ACCESS_TELEMETRY:-false}
    volumes:
      - ./logs/modsecurity/demo-target:/var/log/modsecurity
      - ./config/modsecurity/source-correlation-proxy-backend.conf.template:/etc/nginx/templates/includes/proxy_backend.conf.template:ro
      - ./config/modsecurity/normal-access-logging.conf.template:/etc/nginx/templates/conf.d/00-normal-access-logging.conf.template:ro
      - target_normal_access_socket:/run/cybertrace-normal
    depends_on:
      demo-portal:
        condition: service_healthy
      demo-target-bridge:
        condition: service_healthy

  demo-target-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    profiles:
      - demo-target
    environment:
      WAF_INGEST_API_KEY: ${WAF_INGEST_API_KEY:-}
      WAF_AUDIT_EVIDENCE_KEY: ${WAF_AUDIT_EVIDENCE_KEY:-}
      WAF_SOURCE_PROVENANCE_MODE: ${WAF_SOURCE_PROVENANCE_MODE:-direct_remote_addr}
      WAF_TRUSTED_TUNNEL_PEER: ${WAF_TRUSTED_TUNNEL_PEER:-}
      CYBERTRACE_NORMAL_ACCESS_TELEMETRY: ${CYBERTRACE_NORMAL_ACCESS_TELEMETRY:-false}
      WAF_INGEST_TIMEOUT_SECONDS: ${WAF_INGEST_TIMEOUT_SECONDS:-30}
      WAF_INGEST_MAX_RETRIES: ${WAF_INGEST_MAX_RETRIES:-20}
      WAF_INGEST_RETRY_DELAY_SECONDS: ${WAF_INGEST_RETRY_DELAY_SECONDS:-2}
    command:
      [
        "sh",
        "-c",
        "exec python -u -m scripts.waf_audit_bridge --input /var/log/modsecurity/modsec_audit.jsonl --normal-access-socket /run/cybertrace-normal/normal.sock --follow --endpoint http://backend:8000/api/internal/waf-events --timeout \"$$WAF_INGEST_TIMEOUT_SECONDS\" --max-retries \"$$WAF_INGEST_MAX_RETRIES\" --retry-delay \"$$WAF_INGEST_RETRY_DELAY_SECONDS\"",
      ]
    volumes:
      - ./logs/modsecurity/demo-target:/var/log/modsecurity:ro
      - target_normal_access_socket:/run/cybertrace-normal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,stat,sys; p='/run/cybertrace-normal/normal.sock'; sys.exit(0 if stat.S_ISSOCK(os.stat(p).st_mode) else 1)",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

volumes:
  target_normal_access_socket:
