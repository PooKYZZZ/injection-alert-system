services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cybertrace_pr7_block3
      POSTGRES_USER: pr7_block3
      POSTGRES_PASSWORD: ${PR7_BLOCK3_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr7_block3 -d cybertrace_pr7_block3"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pr7-block3-postgres:/var/lib/postgresql/data
    networks:
      - pr7-block3

  backend:
    ports:
      - "127.0.0.1::8000"
    command:
      [
        "sh",
        "-c",
        "until python -c \"import os,psycopg; connection=psycopg.connect(os.environ['DATABASE_URL'].replace('postgresql+asyncpg://','postgresql://')); connection.close()\"; do sleep 2; done; alembic upgrade head && uvicorn --factory web_app.presentation.app:create_app --host 0.0.0.0 --port 8000",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pr7-block3

  demo-portal:
    build:
      context: ${DEMO_PORTAL_CONTEXT:-../../land-records-portal}
      dockerfile: Dockerfile
    profiles:
      - pr7-block3
    expose:
      - "3010"
    environment:
      NODE_ENV: production
      APP_ENV: testing
      HOSTNAME: 0.0.0.0
      PORT: 3010
      DATABASE_URL: file:./dev.db
      ENFORCEMENT_MODE: off
    volumes:
      - ${DEMO_PORTAL_CONTEXT:-../../land-records-portal}/prisma:/app/prisma
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3010/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - pr7-block3

  pr7-block3-waf:
    build:
      context: .
      dockerfile: Dockerfile.pr7-waf
    profiles:
      - pr7-block3
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::8081"
    environment:
      BACKEND: http://demo-portal:3010
      PORT: 8080
      PARANOIA: 1
      BLOCKING_PARANOIA: 1
      MODSEC_RULE_ENGINE: On
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsecurity/modsec_audit.jsonl
      MODSEC_AUDIT_LOG_PARTS: AIJDEFHZ
      MODSEC_AUDIT_LOG_RELEVANT_STATUS: "^(?:5|4(?!04))"
      WAF_STATE_SNAPSHOT_URL: http://backend:8000/api/internal/waf-enforcement/snapshot
      WAF_STATE_SYNC_API_KEY: ${WAF_STATE_SYNC_API_KEY:-}
      PR7_WAF_MODE: enforce
      PR7_STATE_DIR: /pr7-state
      PR7_PROBE_URL: http://127.0.0.1:8081
      PR7_PROBE_PORT: 8081
      PR7_POLL_INTERVAL: 1
      PR7_SUBPROCESS_TIMEOUT: 5
    volumes:
      - pr7-block3-state:/pr7-state
      - pr7-block3-audit:/var/log/modsecurity
    depends_on:
      backend:
        condition: service_healthy
      demo-portal:
        condition: service_healthy
    networks:
      - pr7-block3

  pr7-block3-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    profiles:
      - pr7-block3
    environment:
      WAF_INGEST_API_KEY: ${WAF_INGEST_API_KEY:-}
      WAF_AUDIT_EVIDENCE_KEY: ${WAF_AUDIT_EVIDENCE_KEY:-}
      WAF_SOURCE_PROVENANCE_MODE: cloudflare_connecting_ip
      WAF_BRIDGE_IGNORE_INTERNAL_PROBES: "true"
      WAF_BRIDGE_PROBE_PORT: "8081"
      APP_ENV: testing
    command:
      [
        "sh",
        "-c",
        "while [ ! -f /var/log/modsecurity/modsec_audit.jsonl ]; do sleep 1; done; python -u -m scripts.waf_audit_bridge --input /var/log/modsecurity/modsec_audit.jsonl --follow --endpoint http://backend:8000/api/internal/waf-events",
      ]
    volumes:
      - pr7-block3-audit:/var/log/modsecurity:ro
    depends_on:
      backend:
        condition: service_healthy
      pr7-block3-waf:
        condition: service_started
    networks:
      - pr7-block3

  source-client-a:
    image: python:3.14-alpine
    profiles:
      - pr7-block3
    command: ["python", "-c", "import time; time.sleep(3600)"]
    networks:
      pr7-block3:
        ipv4_address: 172.31.7.10

  source-client-b:
    image: python:3.14-alpine
    profiles:
      - pr7-block3
    command: ["python", "-c", "import time; time.sleep(3600)"]
    networks:
      pr7-block3:
        ipv4_address: 172.31.7.11

networks:
  pr7-block3:
    ipam:
      config:
        - subnet: 172.31.7.0/24

volumes:
  pr7-block3-postgres:
  pr7-block3-state:
  pr7-block3-audit:
