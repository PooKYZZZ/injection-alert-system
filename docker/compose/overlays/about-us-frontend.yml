# Dedicated public-site frontend for cybertracesystems.com.
# Start from this repository root with:
#   docker compose --project-directory . -p cybertrace-public-site -f docker/compose/overlays/about-us-frontend.yml up -d --build
services:
  about-us-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cybertrace-about-us-frontend:stable
    container_name: cybertrace-about-us-frontend
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    networks:
      public-site-ingress:
        aliases:
          - about-us-frontend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/',
          {headers:{'x-forwarded-host':'cybertracesystems.com'}})
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  public-site-ingress:
    external: true
    name: injection-alert-system_app_cloudflare_ingress
