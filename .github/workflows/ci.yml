name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
on:
  push:
    branches: [master, frontend-adaptation]
  pull_request:
    branches: [master]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      MODEL_PATH: ./ml_model/model_registry
      MODEL_REGISTRY_PATH: ./ml_model/model_registry
      APP_ENV: testing
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: pip install pip-audit
      # Exception owner: backend dependency-maintenance. Review by 2026-09-30.
      # PYSEC-2026-3447 concerns Unicode exclusion bypass while building macOS
      # source distributions; CI installs Linux wheels and publishes none.
      # Remove when active PyTorch permits setuptools>=83, or earlier if macOS
      # packaging/source-distribution jobs are introduced.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-3447
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cybertrace-ci-only
          POSTGRES_DB: cybertrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cybertrace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:cybertrace-ci-only@127.0.0.1:5432/cybertrace
      CYBERTRACE_POSTGRES_TEST_URL: postgresql://postgres:cybertrace-ci-only@127.0.0.1:5432/cybertrace
      PR7_TEST_DATABASE_URL: postgresql+asyncpg://postgres:cybertrace-ci-only@127.0.0.1:5432/cybertrace
      APP_ENV: testing
      MODEL_PATH: ./ml_model/model_registry
      MODEL_REGISTRY_PATH: ./ml_model/model_registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/prepare_ci_postgres_roles.py
      - run: python -m alembic upgrade head
      - run: pytest -q tests/integration
      - run: pytest -q tests/migrations
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          AUTH_SECRET: ci-build-only-placeholder
  auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run critical authentication journeys
        run: npm run test:e2e:auth
        working-directory: frontend
      - name: Upload redacted authentication failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-e2e-failure-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/auth
            frontend/test-results/auth
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable authentication resources
        if: always()
        run: |
          docker ps -aq --filter "label=cybertrace.auth-e2e=true" | xargs -r docker rm -f
          docker network ls -q --filter "label=cybertrace.auth-e2e=true" | xargs -r docker network rm
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  pr7-waf-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned PR7 WAF image
        run: docker build -f Dockerfile.pr7-waf -t cybertrace-pr7-waf-ci .
      - name: Start with unavailable backend
        run: |
          docker run -d --name cybertrace-pr7-waf-ci \
            -e WAF_STATE_SNAPSHOT_URL=http://127.0.0.1:9/api/internal/waf-enforcement/snapshot \
            -e WAF_STATE_SYNC_API_KEY=tttttttttttttttttttttttttttttttt \
            -e PR7_STATE_DIR=/pr7-state \
            -e PR7_WAF_MODE=enforce \
            -e PR7_PROBE_URL=http://127.0.0.1:8081 \
            -e PR7_PROBE_PORT=8081 \
            -e PR7_POLL_INTERVAL=60 \
            -e PR7_SUBPROCESS_TIMEOUT=5 \
            -e BACKEND=http://127.0.0.1:9 \
            -e PORT=8080 \
            -e MODSEC_RULE_ENGINE=On \
            -e MODSEC_AUDIT_ENGINE=RelevantOnly \
            -e MODSEC_AUDIT_LOG_FORMAT=JSON \
            -e MODSEC_AUDIT_LOG_TYPE=Serial \
            -e MODSEC_AUDIT_LOG_PARTS=AIJDEFHZ \
            -e MODSEC_AUDIT_LOG=/var/log/modsecurity/modsec_audit.jsonl \
            -v pr7-waf-ci-state:/pr7-state \
            cybertrace-pr7-waf-ci
      - name: Run activation and maximum-size smoke matrix
        run: docker exec cybertrace-pr7-waf-ci python3 /opt/pr7/pr7-waf-smoke.py
      - name: Restart in OFF mode and confirm empty state
        run: |
          docker rm -f cybertrace-pr7-waf-ci
          docker run -d --name cybertrace-pr7-waf-ci \
            -e WAF_STATE_SNAPSHOT_URL=http://127.0.0.1:9/api/internal/waf-enforcement/snapshot \
            -e WAF_STATE_SYNC_API_KEY=tttttttttttttttttttttttttttttttt \
            -e PR7_STATE_DIR=/pr7-state \
            -e PR7_WAF_MODE=off \
            -e PR7_PROBE_URL=http://127.0.0.1:8081 \
            -e PR7_PROBE_PORT=8081 \
            -e PR7_POLL_INTERVAL=60 \
            -e PR7_SUBPROCESS_TIMEOUT=5 \
            -e BACKEND=http://127.0.0.1:9 \
            -e PORT=8080 \
            -e MODSEC_RULE_ENGINE=On \
            -e MODSEC_AUDIT_ENGINE=RelevantOnly \
            -e MODSEC_AUDIT_LOG_FORMAT=JSON \
            -e MODSEC_AUDIT_LOG_TYPE=Serial \
            -e MODSEC_AUDIT_LOG_PARTS=AIJDEFHZ \
            -e MODSEC_AUDIT_LOG=/var/log/modsecurity/modsec_audit.jsonl \
            -v pr7-waf-ci-state:/pr7-state \
            cybertrace-pr7-waf-ci
          for attempt in $(seq 1 30); do
            if docker exec cybertrace-pr7-waf-ci python3 -c "import json; assert json.load(open('/pr7-state/selected.json'))['selected_kind'] == 'mode_empty'"; then break; fi
            sleep 1
          done
          docker exec cybertrace-pr7-waf-ci python3 -c "import json, httpx; assert json.load(open('/pr7-state/selected.json'))['selected_kind'] == 'mode_empty'; assert httpx.get('http://127.0.0.1:8081/records/search', timeout=3, trust_env=False).status_code == 204"
      - name: Upload redacted WAF logs on failure
        if: failure()
        run: docker logs cybertrace-pr7-waf-ci > pr7-waf-ci.log 2>&1 || true
      - name: Publish WAF failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-waf-ci-failure-${{ github.run_attempt }}
          path: pr7-waf-ci.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable WAF container
        if: always()
        run: docker rm -f cybertrace-pr7-waf-ci || true; docker volume rm pr7-waf-ci-state || true
