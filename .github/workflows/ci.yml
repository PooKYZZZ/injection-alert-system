name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
on:
  push:
    branches: [master, frontend-adaptation]
  pull_request:
    branches: [master]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      MODEL_PATH: ./ml_model/model_registry
      MODEL_REGISTRY_PATH: ./ml_model/model_registry
      APP_ENV: testing
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cybertrace-ci-only
          POSTGRES_DB: cybertrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cybertrace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:cybertrace-ci-only@127.0.0.1:5432/cybertrace
      CYBERTRACE_POSTGRES_TEST_URL: postgresql://postgres:cybertrace-ci-only@127.0.0.1:5432/cybertrace
      APP_ENV: testing
      MODEL_PATH: ./ml_model/model_registry
      MODEL_REGISTRY_PATH: ./ml_model/model_registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: pytest -q tests/integration
      - run: pytest -q tests/migrations
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          AUTH_SECRET: ci-build-only-placeholder
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
