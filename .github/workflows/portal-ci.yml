name: Portal CI

on:
  pull_request:
    branches: [stable/portal-pre-waf]

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
