services:
  modsecurity:
    image: owasp/modsecurity-crs:nginx-alpine
    expose:
      - "80"
    environment:
      BACKEND: http://backend:8000
      PARANOIA: 1
      ALLOWED_METHODS: GET POST PATCH
    depends_on:
      - backend

  backend:
    build: .
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - path: frontend/.env.local
        required: false
    environment:
      FASTAPI_BASE_URL: http://backend:8000
    depends_on:
      - backend

  bridge:
    build: .
    env_file:
      - path: .env
        required: false
    command:
      [
        "python",
        "scripts/waf_audit_bridge.py",
        "--input",
        "/fixtures/waf_event.jsonl",
        "--endpoint",
        "http://backend:8000/api/internal/waf-events",
      ]
    volumes:
      - ./scripts/fixtures/waf_event.jsonl:/fixtures/waf_event.jsonl:ro
    depends_on:
      - backend
