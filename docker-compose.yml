services:
  modsecurity:
    image: owasp/modsecurity-crs@sha256:0385a81159d5112c113eeeed01c3f6cf05113891b02addc23abeab180934911e
    profiles:
      - technical-waf
    expose:
      - "80"
    ports:
      - "8088:8080"
    environment:
      BACKEND: http://backend:8000
      PARANOIA: 1
      ALLOWED_METHODS: GET POST PATCH
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsecurity/modsec_audit.jsonl
      MODSEC_AUDIT_LOG_PARTS: AIJDEFHZ
      MODSEC_AUDIT_LOG_RELEVANT_STATUS: "^(?:5|4(?!04))"
    volumes:
      - ./logs/modsecurity:/var/log/modsecurity
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: .
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn --factory web_app.presentation.app:create_app --host 0.0.0.0 --port 8000",
      ]
    expose:
      - "8000"
    env_file:
      - path: .env
        required: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      WAF_INGEST_API_KEY: ${WAF_INGEST_API_KEY:-}
      WAF_AUDIT_EVIDENCE_KEY: ${WAF_AUDIT_EVIDENCE_KEY:-}
      WAF_STATE_SYNC_ENABLED: ${WAF_STATE_SYNC_ENABLED:-false}
      WAF_STATE_SYNC_API_KEY: ${WAF_STATE_SYNC_API_KEY:-}
      PR7_CRITICAL_WAF_MUTATION_ENABLED: ${PR7_CRITICAL_WAF_MUTATION_ENABLED:-false}
      PR7_WAF_CAPACITY: ${PR7_WAF_CAPACITY:-64}
      WAF_SOURCE_VERIFICATION_MODE: ${WAF_SOURCE_VERIFICATION_MODE:-unverified}
      ENFORCEMENT_MODE: ${ENFORCEMENT_MODE:-off}
      ENFORCEMENT_CHECK_API_KEY: ${ENFORCEMENT_CHECK_API_KEY:-}
      ENFORCEMENT_RECOMMENDATION_TTL_SECONDS: ${ENFORCEMENT_RECOMMENDATION_TTL_SECONDS:-900}
      ENFORCEMENT_LOW_WINDOW_SECONDS: ${ENFORCEMENT_LOW_WINDOW_SECONDS:-60}
      ENFORCEMENT_LOW_MAX_UNCHALLENGED_REQUESTS: ${ENFORCEMENT_LOW_MAX_UNCHALLENGED_REQUESTS:-5}
      ENFORCEMENT_MEDIUM_WINDOW_SECONDS: ${ENFORCEMENT_MEDIUM_WINDOW_SECONDS:-60}
      ENFORCEMENT_MEDIUM_MAX_REQUESTS: ${ENFORCEMENT_MEDIUM_MAX_REQUESTS:-10}
      ENFORCEMENT_CHALLENGE_GRANT_TTL_SECONDS: ${ENFORCEMENT_CHALLENGE_GRANT_TTL_SECONDS:-300}
      ENFORCEMENT_TURNSTILE_SECRET_KEY: ${ENFORCEMENT_TURNSTILE_SECRET_KEY:-}
      ENFORCEMENT_TURNSTILE_EXPECTED_HOSTNAME: ${ENFORCEMENT_TURNSTILE_EXPECTED_HOSTNAME:-}
      ENFORCEMENT_TURNSTILE_TIMEOUT_SECONDS: ${ENFORCEMENT_TURNSTILE_TIMEOUT_SECONDS:-3}
      ENFORCEMENT_TURNSTILE_TEST_MODE: ${ENFORCEMENT_TURNSTILE_TEST_MODE:-false}
      ENFORCEMENT_SOURCE_TRUST_MODE: ${ENFORCEMENT_SOURCE_TRUST_MODE:-unverified}
      ENFORCEMENT_ALLOW_UNVERIFIED_SOURCE_FOR_TESTS: ${ENFORCEMENT_ALLOW_UNVERIFIED_SOURCE_FOR_TESTS:-false}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - path: frontend/.env.local
        required: false
    environment:
      FASTAPI_BASE_URL: http://backend:8000
    depends_on:
      - backend

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    profiles:
      - technical-waf
    environment:
      WAF_INGEST_API_KEY: ${WAF_INGEST_API_KEY:-}
      WAF_SOURCE_PROVENANCE_MODE: ${WAF_SOURCE_PROVENANCE_MODE:-direct_remote_addr}
      WAF_INGEST_TIMEOUT_SECONDS: ${WAF_INGEST_TIMEOUT_SECONDS:-30}
      WAF_INGEST_MAX_RETRIES: ${WAF_INGEST_MAX_RETRIES:-3}
      WAF_INGEST_RETRY_DELAY_SECONDS: ${WAF_INGEST_RETRY_DELAY_SECONDS:-2}
    command:
      [
        "sh",
        "-c",
        "while [ ! -f /var/log/modsecurity/modsec_audit.jsonl ]; do sleep 1; done; python -u -m scripts.waf_audit_bridge --input /var/log/modsecurity/modsec_audit.jsonl --follow --endpoint http://backend:8000/api/internal/waf-events --timeout \"$$WAF_INGEST_TIMEOUT_SECONDS\" --max-retries \"$$WAF_INGEST_MAX_RETRIES\" --retry-delay \"$$WAF_INGEST_RETRY_DELAY_SECONDS\"",
      ]
    volumes:
      - ./logs/modsecurity:/var/log/modsecurity:ro
    depends_on:
      backend:
        condition: service_healthy

  pr7-waf:
    build:
      context: .
      dockerfile: Dockerfile.pr7-waf
    profiles:
      - pr7-local-waf
    expose:
      - "8080"
    environment:
      BACKEND: http://backend:8000
      PORT: 8080
      PARANOIA: 1
      BLOCKING_PARANOIA: 1
      MODSEC_RULE_ENGINE: On
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsecurity/modsec_audit.jsonl
      MODSEC_AUDIT_LOG_PARTS: AIJDEFHZ
      WAF_STATE_SNAPSHOT_URL: http://backend:8000/api/internal/waf-enforcement/snapshot
      WAF_STATE_SYNC_API_KEY: ${WAF_STATE_SYNC_API_KEY:-}
      PR7_WAF_MODE: ${PR7_WAF_MODE:-off}
      PR7_STATE_DIR: /pr7-state
      NGINX_CONFIG: /etc/nginx/nginx.conf
      PR7_PROBE_URL: http://127.0.0.1:8081
      PR7_PROBE_PORT: 8081
      PR7_POLL_INTERVAL: ${PR7_POLL_INTERVAL:-5}
      PR7_SUBPROCESS_TIMEOUT: ${PR7_SUBPROCESS_TIMEOUT:-5}
    volumes:
      - pr7-state:/pr7-state
      - pr7-audit:/var/log/modsecurity
    depends_on:
      backend:
        condition: service_started

volumes:
  pr7-state:
  pr7-audit:
